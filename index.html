    <title>Nadya Farastanti | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --dark: #0f172a;
            --text: #475569;
            --bg: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.7; scroll-behavior: smooth; overflow-x: hidden; }
        
        /* Navbar */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 5%; max-width: 1200px; margin: auto; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--dark); letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: var(--primary); }
        .nav-links a { margin-left: 30px; text-decoration: none; color: var(--text); font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary); }
        .btn-download { background: var(--primary); color: white !important; padding: 10px 20px; border-radius: 8px; margin-left: 30px; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }
        .btn-download:hover { background: #4338ca; }

        /* Hero Section */
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 60px 5%; max-width: 1200px; margin: auto; min-height: 70vh; }
        .hero-content { flex: 1; padding-right: 50px; }
        .tagline { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 20px; }
        .hero h1 { font-size: 3.5rem; color: var(--dark); font-weight: 700; margin-bottom: 20px; line-height: 1.2; }
        .hero p { font-size: 1.05rem; margin-bottom: 20px; max-width: 500px; }
        
        /* Typewriter */
        .typewrite-wrapper { color: var(--primary); border-right: 3px solid var(--primary); padding-right: 5px; animation: blink 0.75s step-end infinite; }
        @keyframes blink { 50% { border-color: transparent; } }

        /* Hero Image */
        .hero-image { flex: 1; display: flex; justify-content: center; position: relative; }
        .hero-image img { width: 100%; max-width: 400px; border-radius: 24px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.08); z-index: 2; }

        /* Milestones */
        .milestones { display: flex; gap: 20px; margin-top: 40px; }
        .milestone-card { flex: 1; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .milestone-card:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(79,70,229,0.1); }
        .milestone-card span { font-size: 0.8rem; color: var(--primary); font-weight: 700; }
        .milestone-card h4 { font-size: 0.95rem; color: var(--dark); margin-top: 5px; line-height: 1.4; }

        /* Projects Section */
        .projects { padding: 100px 5%; background: #f8fafc; }
        .section-title { font-size: 2.2rem; margin-bottom: 50px; color: var(--dark); font-weight: 700; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
